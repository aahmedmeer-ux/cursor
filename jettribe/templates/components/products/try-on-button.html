{{!--
  Virtual Try-On trigger — place near Add to Cart.
--}}
{{#if theme_settings.tryon_enable}}
<div class="form-action form-action--tryOn">
    <button
        id="form-action-tryOn"
        type="button"
        class="button button--tryOn"
        data-virtual-tryon
        data-product-id="{{product.id}}"
        data-product-title="{{product.title}}"
        data-product-image="{{getImage product.main_image 'original' (cdn theme_settings.default_image_product)}}"
        aria-haspopup="dialog"
        aria-controls="virtual-tryon-modal"
    >
        {{#if theme_settings.tryon_button_label}}{{theme_settings.tryon_button_label}}{{else}}Try it On AI{{/if}}
    </button>
</div>
{{/if}}
