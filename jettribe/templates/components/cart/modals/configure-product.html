<div class="modal-header">
    <h2 class="modal-header-title _configureProduct">{{lang 'cart.reconfigure_product' name=product_name}}</h2>
</div>
<div class="modal-body" data-product-option-change>
    <div class="alertMessageBox" hidden>
        {{> components/common/alert-info}}
    </div>

    <div class="productView-options modal-productView-options">
        <form id="CartEditProductFieldsForm" method="post" action="/cart.php" enctype="multipart/form-data">
            <input type="hidden" name="action" value="EditProductFieldsInCart">
            <input type="hidden" name="item_id" value="{{quote_item_id}}">
            <div data-product-attributes-wrapper>
            {{#each customizations}}
                {{{dynamicComponent 'components/products/customizations'}}}
            {{/each}}
            {{#each options}}
                {{{dynamicComponent 'components/products/options'}}}
            {{/each}}
            </div>

            <div class="form-actions">
                <div class="form-action form-action--designTool" style="display: none;" data-design-tool-wrapper>
                    <button class="design-tool-product button button--black" type="button" data-design-tool>
                        {{lang 'design_tool.button_open'}}
                    </button>
                </div>
                <input class="button button--primary" type="submit" value="{{lang 'common.save'}}">
            </div>
        </form>
    </div>

    {{#each options}}
        <span data-pd-option-name="{{display_name}}" style="display: none;"></span>
    {{/each}}
</div>
