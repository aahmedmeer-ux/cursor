<section class="productCarousel"
    data-slick='{
        "dots": true,
        "infinite": false,
        "mobileFirst": true,
        "slidesToShow": 1,
        "slidesToScroll": 1,
        "responsive": [
            {
                "breakpoint": 1200,
                "settings": {
                    "slidesToScroll": 5,
                    "slidesToShow": 5
                }
            },
            
            {
                "breakpoint": 991,
                "settings": {
                    "slidesToScroll": 4,
                    "slidesToShow": 4
                }
            },
            {
                "breakpoint": 768,
                "settings": {
                    "slidesToScroll": 3,
                    "slidesToShow": 3
                }
            }, 

			 {
                "breakpoint": 767,
                "settings": {
                    "slidesToScroll": 3,
                    "slidesToShow": 3
                }
			},
             {
                "breakpoint": 510,
                "settings": {
                    "slidesToScroll": 2,
                    "slidesToShow": 2
                }
            },
            {
                "breakpoint": 319,
                "settings": {
                    "slidesToScroll": 1,
                    "slidesToShow": 1
                }
			}
        ]
    }'
>
 
      {{#each products}}
    <div class="productCarousel-slide">
        {{> components/products/card settings=../settings theme_settings=../theme_settings customer=../customer event="list" position=(add @index 1)}}
    </div>
    {{/each}}
</section>
