{{#with theme_settings}}
<div class="footer-payment-icons">
    {{#if show_accept_mastercard}}
        <svg class="footer-payment-icon" aria-label="Mastercard">
            <use href="#icon-logo-mastercard"></use>
        </svg>
    {{/if}}
    {{#if show_accept_visa}}
        <svg class="footer-payment-icon" aria-label="Visa">
            <use href="#icon-logo-visa"></use>
        </svg>
    {{/if}}
    {{#if show_accept_amex}}
        <svg class="footer-payment-icon" aria-label="American Express">
            <use href="#icon-logo-american-express"></use>
        </svg>
    {{/if}}
    {{#if show_accept_paypal}}
        <svg class="footer-payment-icon" aria-label="PayPal">
            <use href="#icon-logo-paypal"></use>
        </svg>
    {{/if}}
    {{#if show_accept_googlepay}}
        <svg class="footer-payment-icon" aria-label="Google Pay">
            <use href="#icon-logo-googlepay"></use>
        </svg>
    {{/if}}
    {{#if show_accept_amazon}}
        <svg class="footer-payment-icon" aria-label="Amazon Pay">
            <use href="#icon-logo-amazon"></use>
        </svg>
    {{/if}}
</div>
{{{region name="footer_payment_icons--global"}}}
{{/with}}
